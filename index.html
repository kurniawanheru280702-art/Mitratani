<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator Sawah Satelit</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/@turf/turf@6/turf.min.js"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background-color: #C0C0C0; padding: 10px; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 15px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #000000; margin-bottom: 20px; font-size: 30px; }
        .search-group { display: flex; gap: 5px; margin-bottom: 10px; }
        .search-group input { flex: 1; padding: 10px; border: 2px solid #000000; border-radius: 6px; font-size: 14px; outline: none; }
        .search-group button { width: auto; margin-top: 0; padding: 0 15px; background: #000000; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .search-group button:hover { background: #000000; }

        
        /* Ukuran Kotak Peta Satelit */
        #map { width: 100%; height: 300px; border-radius: 8px; margin-bottom: 15px; border: 2px solid #2e7d32; }
        
        .instruksi { background: #000000; padding: 10px; border-radius: 6px; font-size: 13px; color: #2e7d32; margin-bottom: 15px; line-height: 1.4; }
        .form-group { margin-bottom: 12px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 14px; color: #333; }
        input, select, button { width: 100%; padding: 11px; border: 1px solid #ccc; border-radius: 6px; font-size: 15px; }
        input[readonly] { background-color: #eec; font-weight: bold; color: #000; }
        button { background: #000000; color: white; font-weight: bold; border: none; cursor: pointer; margin-top: 10px; }
        button:hover { background: #000000; }
        .btn-reset { background: #000000; margin-top: 5px; }
        .btn-reset:hover { background: #000000; }
        
        .hasil-box { margin-top: 15px; padding: 15px; background: #f9f9f9; border-left: 5px solid #2e7d32; border-radius: 4px; display: none; }
        .hasil-item { display: flex; justify-content: space-between; margin-bottom: 8px; }
        .footer-aplikasi {
    text-align: center;
    margin-top: 20px;
    padding-bottom: 5px;
}

.footer-aplikasi p {
    font-size: 12px;
    color: #666;
    line-height: 1.5;
    margin: 0;
    letter-spacing: 0.5px;
}

.footer-aplikasi b {
    color: #000000; /* Nama Bang Heru dikasih warna hijau khas biar menonjol */
}

    </style>
</head>
<body>

<div class="container">
    <h2><b>MITRA TANI DIGITAL</b></h2>
    <label>Cari Lokasi / Desa / Sharelok:</label>
    <div class="search-group">
        <input type="text" id="inputCari" placeholder="Contoh: tegalwulung brebes" onkeypress="if(event.key === 'Enter') cariLokasi()">
        <button type="button" onclick="cariLokasi()">🔍 Cari</button>
        
    </div>

    <div id="map"></div>

    <button class="btn-reset" onclick="resetPeta()">RESET</button>
    <hr style="margin: 20px 0; border: 0; border-top: 1px solid #ccc;">
    <!-- PILIHAN KOMODITAS -->
    <div class="form-group">
        <label>Pilih Jenis Komoditas Tanaman:</label>
        <select id="jenisKomoditas" onchange="sesuaikanOpsiKomoditas()">
            <option value="padi">🌾 Padi (Gabah)</option>
            <option value="jagung">🌽 Jagung</option>
            <option value="bawang">🧅 Bawang Merah</option>
        </select>
    </div>

    <div class="form-group">
        <label>Luas Lahan Hasil Satelit (m²):</label>
        <input type="number" id="luasSawah" readonly placeholder="Otomatis terisi saat peta diklik">
    </div>

    <div class="form-group">
        <label>Kondisi Hasil Lapangan:</label>
        <select id="kondisiPadi">
            <!-- Isi option akan berubah otomatis lewat JavaScript sesuai tanaman -->
        </select>
    </div>

    <div class="form-group">
        <label id="labelHarga">Harga Hasil per Kg (Rp):</label>
        <input type="number" id="hargaGabah" value="7000">
    </div>

    <button onclick="hitungTonase()">Mulai Hitung Hasil & Harga</button>

    <div id="kotakHasil" class="hasil-box">
        <h4 style="color:#2e7d32; margin-bottom:10px;">📋 Hasil Analisis Taksiran:</h4>
        <div class="hasil-item"><span>Estimasi Kotor :</span> <strong id="resKotor">0 Kg</strong></div>
        <div class="hasil-item"><span>Estimasi Bersih :</span> <strong id="resKg">0 Kg</strong></div>
        <div class="hasil-item"><span>Tonase Bersih :</span> <strong id="resTon">0 Ton</strong></div>
        <div class="hasil-item" style="border-top:1px solid #ddd; padding-top:5px; margin-top:5px; font-size:16px;">
        <span>Estimasi Tebasan/jual :</span> <strong id="resUang" style="color:#b71c1c;">Rp 0</strong>
            
        </div>
        <button onclick="generatePDF()" style="background: #1565c0; margin-top: 15px;">💾 Simpan / Cetak Hasil PDF</button>
        <button onclick="kirimKeTelegram()" style="background: #229ED9; margin-top: 5px;">✈️ Kirim Laporan ke Telegram</button>


    </div>
</div>

<script>
    // DATA METODE UBINAN TRADISIONAL BERBAGAI KOMODITAS
    const dataOpsi = {
        padi: {
            hargaDefault: 7000,
            labelHarga: "Harga Gabah Kering Panen (GKP):",
            potongan: 0.10, // Potongan 10%
            opsi: [
                { value: "5.5", text: "Sangat Bagus (Bulir padat, mentes, tidak kena hama)" },
                { value: "4.5", text: "Normal / Rata-rata (Bagus standar kampung)", selected: true },
                { value: "3.5", text: "Kurang Bagus (Banyak bulir hampa / roboh sedikit)" },
                { value: "2.0", text: "Rusak / Kena Hama (Simulasi Gagal Panen Sebagian)" }
            ]
        },
        jagung: {
            hargaDefault: 5000,
            labelHarga: "Harga Jagung Pipil Kering per Kg (Rp):",
            potongan: 0.12, // Potongan 12% (biasanya karena kadar air/janggel)
            opsi: [
                { value: "7.0", text: "Sangat Lebat (Tongkol besar isi penuh, rapat)" },
                { value: "5.5", text: "Normal / Rata-rata (Standar ubinan jagung umum)", selected: true },
                { value: "4.0", text: "Kurang Bagus (Tongkol kecil/bule/banyak kosong)" },
                { value: "2.5", text: "Rusak / Terbakar Hama Ulat" }
            ]
        },
        bawang: {
            hargaDefault: 20000,
            labelHarga: "Harga Bawang Merah per Kg (Rp):",
            potongan: 0.15, // Potongan 15% (karena kadar air bawang susut banyak saat kering)
            opsi: [
                { value: "12.0", text: "Super (Populasi rapat, umbi besar-besar/merah)" },
                { value: "9.5", text: "Normal / Rata-rata (Standar panen bawang)", selected: true },
                { value: "7.0", text: "Kurang Bagus (Umbi kecil/mokel/terserang ulat)" },
                { value: "4.0", text: "Rusak / Busuk Daun Boler" }
            ]
        }
    };

    function sesuaikanOpsiKomoditas() {
        let tanaman = document.getElementById("jenisKomoditas").value;
        let config = dataOpsi[tanaman];
        
        // Sesuaikan label harga dan nilai defaultnya
        document.getElementById("labelHarga").innerText = config.labelHarga;
        document.getElementById("hargaGabah").value = config.hargaDefault;
        
        // Hapus opsi ubinan yang lama, ganti yang baru
        let selectKondisi = document.getElementById("kondisiPadi");
        selectKondisi.innerHTML = "";
        
        config.opsi.forEach(opt => {
            let el = document.createElement("option");
            el.value = opt.value;
            el.innerText = opt.text;
            if(opt.selected) el.selected = true;
            selectKondisi.appendChild(el);
        });
        
        // Sembunyikan hasil lama kalau ganti tanaman
        document.getElementById("kotakHasil").style.display = "none";
    }

    // Jalankan pertama kali saat aplikasi dibuka agar default padi muncul
    sesuaikanOpsiKomoditas();

    // 1. TAMBAHKAN maxZoom: 23 di dalam L.map bawaanmu
var map = L.map('map', {
    maxZoom: 23 // Mengizinkan peta utama menerima zoom digital hingga skala 23
}).setView([-6.945977,109.070103], 15); 

// 2. GANTI bagian L.tileLayer milikmu dengan konfigurasi Super Zoom ini
L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
    attribution: 'Esri Satellite',
    maxZoom: 23,        // Batas maksimal jempol kita bisa nge-zoom di HP
    maxNativeZoom: 19   // KUNCI UTAMA: Server Esri mentok di 19, sisanya dibantu zoom digital oleh HP biar tidak blank!
}).addTo(map);


    var koordinatTitik = [];
    var poligonSawah = null;
    var arrayPenanda = [];
    var popupPencarian = null;
var penandaShareLoc = null; // Deklarasi awal agar HP tidak bingung

function cariLokasi() {
    let keyword = document.getElementById("inputCari").value.trim();
    if (!keyword) { alert("Ketik nama daerah/desa atau tempel koordinat Share Loc!"); return; }

    // Pola Deteksi Koordinat (Angka, Koma, Angka)
    let polaKoordinat = /^[-+]?([1-8]?\d(\.\d+)?|90(\.0+)?),\s*[-+]?(180(\.0+)?|((1[0-7]\d)|([1-9]?\d))(\.\d+)?)$/;

    if (polaKoordinat.test(keyword)) {
        let bagian = keyword.split(",");
        let lat = parseFloat(bagian[0]);
        let lon = parseFloat(bagian[1]);

        // Terbangkan satelit ke koordinat angka (Zoom 18)
        map.setView([lat, lon], 18);

        if (penandaShareLoc) { map.removeLayer(penandaShareLoc); }

        // Pasang marker merah di titik sharelok
        penandaShareLoc = L.marker([lat, lon]).addTo(map)
            .bindPopup("<b>Titik Sawah Terdeteksi</b><br>Silakan ketuk sudut pematang sawah untuk mengukur.")
            .openPopup();

        return; // 🛑 KUNCI PERBAIKAN: Berhenti di sini agar tidak kebablasan memunculkan alert eror!
    } 

    // JIKA BUKAN KOORDINAT (Mencari menggunakan Teks Nama Desa/Daerah)
    let url = "https://nominatim.openstreetmap.org/search?format=json&limit=1&q=" + encodeURIComponent(keyword + ", Indonesia");

    fetch(url)
        .then(response => response.json())
        .then(data => {
            if (data.length > 0) {
                let lat = parseFloat(data[0].lat);
                let lon = parseFloat(data[0].lon);
                map.setView([lat, lon], 16);
                
                if (penandaShareLoc) { map.removeLayer(penandaShareLoc); }
                
                penandaShareLoc = L.marker([lat, lon]).addTo(map)
                    .bindPopup("<b>" + data[0].display_name + "</b><br>Silakan cari lokasi sawahnya.")
                    .openPopup();
            } else {
                alert("Nama lokasi tidak ditemukan. Coba ketik lebih detail.");
            }
        })
        .catch(err => {
            alert("Gagal memuat data pencarian.");
        });
}


    function resetPeta() {
        koordinatTitik = [];
        if (poligonSawah) { map.removeLayer(poligonSawah); poligonSawah = null; }
        arrayPenanda.forEach(m => map.removeLayer(m));
        arrayPenanda = [];
        if (penandaShareLoc) { map.removeLayer(penandaShareLoc); penandaShareLoc = null; }
        document.getElementById("luasSawah").value = "";
        document.getElementById("kotakHasil").style.display = "none";
    }

    // --- RUMUS HITUNG MULTI-KOMODITAS ---
    function hitungTonase() {
        let luas = parseFloat(document.getElementById("luasSawah").value);
        let indeksKondisi = parseFloat(document.getElementById("kondisiPadi").value);
        let harga = parseFloat(document.getElementById("hargaGabah").value);
        let tanaman = document.getElementById("jenisKomoditas").value;

        if (!luas) { alert("Silakan tentukan area lahan di peta terlebih dahulu!"); return; }

        let config = dataOpsi[tanaman];

        // Rumus Dasar Ubinan Pertanian: (Luas / 6.25) * Berat Sampel Ubinan
        let beratKotor = (luas / 6.25) * indeksKondisi;
        let beratBersih = beratKotor * (1 - config.potongan); 
        let totalHarga = beratBersih * harga;

        document.getElementById("kotakHasil").style.display = "block";
        document.getElementById("resKotor").innerText = Math.round(beratKotor).toLocaleString('id-ID') + " Kg";
        document.getElementById("resKg").innerText = Math.round(beratBersih).toLocaleString('id-ID') + " Kg";
        document.getElementById("resTon").innerText = (beratBersih / 1000).toFixed(2) + " Ton";
        document.getElementById("resUang").innerText = "Rp " + Math.round(totalHarga).toLocaleString('id-ID');
    }
    function generatePDF() {
    // Ambil data dari inputan dan hasil kalkulasi
    let tanaman = document.getElementById("jenisKomoditas").options[document.getElementById("jenisKomoditas").selectedIndex].text;
    let luas = document.getElementById("luasSawah").value;
    let kondisi = document.getElementById("kondisiPadi").options[document.getElementById("kondisiPadi").selectedIndex].text;
    let harga = document.getElementById("hargaGabah").value;
    
    let kotor = document.getElementById("resKotor").innerText;
    let bersih = document.getElementById("resKg").innerText;
    let tonase = document.getElementById("resTon").innerText;
    let uang = document.getElementById("resUang").innerText;

    if (!luas || luas == "0" || luas == "") {
        alert("Silakan hitung lahan di peta terlebih dahulu sebelum cetak PDF!");
        return;
    }

    // Dapatkan tanggal dan waktu hari ini secara otomatis
    let opsiTanggal = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
    let tanggalHariIni = new Date().toLocaleDateString('id-ID', opsiTanggal);

    // Buat jendela cetak baru (Pop-up terisolasi khusus nota)
    let jendelaCetak = window.open('', '', 'height=600,width=800');
    
    // Desain Layout Nota PDF yang rapi, bersih, dan profesional
    jendelaCetak.document.write(`
        <html>
        <head>
            <title>Nota Taksiran Hasil Lahan</title>
            <style>
                body { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; color: #333; padding: 30px; line-height: 1.6; }
                .Header-nota { text-align: center; border-bottom: 3px double #2e7d32; padding-bottom: 15px; margin-bottom: 25px; }
                .Header-nota h1 { color: #2e7d32; margin: 0; font-size: 26px; text-transform: uppercase; }
                .Header-nota p { margin: 5px 0 0 0; color: #666; font-size: 14px; font-style: italic; }
                .info-meta { font-size: 13px; color: #555; margin-bottom: 20px; text-align: right; }
                table { width: 100%; border-collapse: collapse; margin-bottom: 30px; }
                th, td { padding: 12px 15px; text-align: left; border-bottom: 1px solid #ddd; }
                th { background-color: #f1f8e9; color: #2e7d32; font-weight: bold; width: 40%; }
                .total-row { background-color: #e8f5e9; font-size: 18px; font-weight: bold; }
                .total-row td { color: #b71c1c; border-top: 2px solid #2e7d32; border-bottom: 2px solid #2e7d32; }
                .catatan { font-size: 11px; color: #777; margin-top: 40px; border-top: 1px dashed #ccc; padding-top: 10px; text-align: center; }
            </style>
        </head>
        <body>
            <div class="Header-nota">
                <h1>🌾 MITRA TANI DIGITAL</h1>
                <p>Aplikasi Analisis Taksiran Hasil Bumi & Ukur Lahan Satelit</p>
            </div>
            
            <div class="info-meta">
                <strong>Tanggal Analisis:</strong> ${tanggalHariIni}
            </div>

            <table>
                <tr>
                    <th>Komoditas Tanaman</th>
                    <td>${tanaman}</td>
                </tr>
                <tr>
                    <th>Luas Lahan Hasil Satelit</th>
                    <td>${Number(luas).toLocaleString('id-ID')} m²</td>
                </tr>
                <tr>
                    <th>Kondisi Fisik Lapangan</th>
                    <td>${kondisi}</td>
                </tr>
                <tr>
                    <th>Harga Pasar per Kg</th>
                    <td>Rp ${Number(harga).toLocaleString('id-ID')}</td>
                </tr>
                <tr>
                    <th>Estimasi Hasil Kotor</th>
                    <td>${kotor}</td>
                </tr>
                <tr>
                    <th>Estimasi Bersih (Setelah Potongan)</th>
                    <td>${bersih}</td>
                </tr>
                <tr>
                    <th>Total Tonase Bersih</th>
                    <td>${tonase}</td>
                </tr>
                <tr class="total-row">
                    <td>Estimasi Nilai Jual / Tebasan</td>
                    <td>${uang}</td>
                </tr>
            </table>

            <div class="catatan">
                * Nota ini diterbitkan secara mandiri melalui sistem kalkulasi satelit digital.<br>
                Harap gunakan angka taksiran di atas sebagai acuan dasar yang adil dalam negosiasi jual-beli.
            </div>
        </body>
        </html>
    `);

    // Proses eksekusi cetak/simpan PDF
    jendelaCetak.document.close();
    jendelaCetak.focus();
    
    // Memberi jeda 500ms agar halaman pop-up ter-load sempurna baru memicu simpan PDF
    setTimeout(function() {
        jendelaCetak.print();
        jendelaCetak.close();
    }, 500);
}
    function kirimKeTelegram() {
    // 1. Ambil data dari kalkulator web
    let tanaman = document.getElementById("jenisKomoditas").options[document.getElementById("jenisKomoditas").selectedIndex].text;
    let luas = document.getElementById("luasSawah").value;
    let kondisi = document.getElementById("kondisiPadi").options[document.getElementById("kondisiPadi").selectedIndex].text;
    let harga = document.getElementById("hargaGabah").value;
    
    let kotor = document.getElementById("resKotor").innerText;
    let bersih = document.getElementById("resKg").innerText;
    let tonase = document.getElementById("resTon").innerText;
    let uang = document.getElementById("resUang").innerText;

    if (!luas || luas == "0" || luas == "") {
        alert("Silakan hitung lahan di peta terlebih dahulu sebelum kirim data!");
        return;
    }

    // 2. GANTI DENGAN DATA RAHASIA TELEGRAM ABANG DI SINI
    const TOKEN_BOT = "8742558782:AAFn8pEefEyEZ8pMDVJ-vZQhthIsMZp_nBw"; 
    const CHAT_ID_ANDA = "7360001889";

    // 3. Susun format teks laporan yang rapi untuk dibaca di HP
    let pesanTelegram = "🔔 *LAPORAN TAKSIRAN BARU - MITRA TANI DIGITAL*\n";
    pesanTelegram += "----------------------------------------------\n";
    pesanTelegram += "🌾 *Komoditas:* " + tanaman + "\n";
    pesanTelegram += "📐 *Luas Lahan:* " + Number(luas).toLocaleString('id-ID') + " m²\n";
    pesanTelegram += "🌱 *Kondisi Lapangan:* " + kondisi + "\n";
    pesanTelegram += "💰 *Harga Pasar:* Rp " + Number(harga).toLocaleString('id-ID') + "/Kg\n\n";
    pesanTelegram += "📋 *HASIL ANALISIS:*\n";
    pesanTelegram += "• Hasil Kotor: " + kotor + "\n";
    pesanTelegram += "• Hasil Bersih: " + bersih + "\n";
    pesanTelegram += "• Total Tonase: " + tonase + "\n";
    pesanTelegram += "----------------------------------------------\n";
    pesanTelegram += "🔴 *ESTIMASI NILAI JUAL/TEBASAN:*\n";
    pesanTelegram += "*👉 " + uang + "*\n\n";
    pesanTelegram += "🚀 _Laporan terkirim otomatis dari sistem satelit._";

    // 4. Proses penembakan data ke API Telegram secara real-time
    let urlAPI = "https://api.telegram.org/bot" + TOKEN_BOT + "/sendMessage";
    
    fetch(urlAPI, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
            chat_id: CHAT_ID_ANDA,
            text: pesanTelegram,
            parse_mode: "Markdown" // Biar teks di Telegram bisa tebal/miring otomatis
        })
    })
    .then(response => response.json())
    .then(data => {
        if (data.ok) {
            alert("🚀 Sukses! Data taksiran hasil panen telah dikirim ke Telegram Juragan.");
        } else {
            alert("Gagal mengirim ke Telegram. Cek kembali Token Bot Anda.");
        }
    })
    .catch(err => {
        alert("Terjadi gangguan jaringan saat mengirim data.");
    });
}


</script>
<div class="footer-aplikasi">
    <hr style="margin: 10px 0; border: 0; border-top: 0px dashed #ccc;">
    <p>Dikembangkan oleh <b>Heru Kurniawan</b></p>

</div>

</body>
</html>
