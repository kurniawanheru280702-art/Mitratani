        let currentIndex = 0;
        const container = document.getElementById('script-container');

        // Jam Digital
        setInterval(() => {
            document.getElementById('digital-clock').innerText = new Date().toLocaleTimeString('id-ID', { hour12: false });
        }, 1000);

        // Render Naskah
        function renderNaskah() {
            container.innerHTML = naskah.map((baris, index) => {
                let colorClass = baris.nama === "BIANCA" ? 'text-pink-400 border-pink-500' : 
                                 baris.nama === "HERU" ? 'text-cyan-400 border-cyan-500' : 
                                 'text-purple-400 border-purple-500 animate-pulse';

                const isActive = index === currentIndex;
                const activeStyle = isActive 
                    ? `opacity-100 scale-100 border-l-8 pl-6 py-4 bg-gray-800/50 rounded-r-2xl ${colorClass}` 
                    : `opacity-25 scale-95 border-l-4 pl-4 border-transparent text-gray-500`;

                return `
                    <div id="line-${index}" class="transition-all duration-500 ease-in-out transform origin-left ${activeStyle}">
                        <div class="text-sm md:text-lg font-bold tracking-widest mb-2 uppercase opacity-80">${baris.nama}</div>
                        <div class="text-3xl md:text-5xl font-semibold leading-snug">${baris.teks}</div>
                    </div>
                `;
            }).join('');

            const activeElement = document.getElementById(`line-${currentIndex}`);
            if (activeElement) activeElement.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }

        // Logic Navigasi & Firebase Sync
        if (db) {
            db.ref('mc_somic_2026/currentIndex').on('value', (snapshot) => {
                const val = snapshot.val();
                if (val !== null) {
                    currentIndex = val;
                    renderNaskah();
                } else {
                    db.ref('mc_somic_2026/currentIndex').set(0);
                }
            });
        } else {
            renderNaskah(); // Render lokal jika firebase belum diisi
        }

        function nextLine() {
            if (currentIndex < naskah.length - 1) {
                if (db) db.ref('mc_somic_2026/currentIndex').set(currentIndex + 1);
                else { currentIndex++; renderNaskah(); }
            }
        }

        function prevLine() {
            if (currentIndex > 0) {
                if (db) db.ref('mc_somic_2026/currentIndex').set(currentIndex - 1);
                else { currentIndex--; renderNaskah(); }
            }
        }

        // Keyboard Shortcut
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space' || e.code === 'ArrowRight') {
                e.preventDefault();
                nextLine();
            } else if (e.code === 'ArrowLeft') {
                prevLine();
            }
        });
