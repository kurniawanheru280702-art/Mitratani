<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FAMGET SOMIC 2026</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="icon" type="image/x-icon" href="logoo.ico">
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <style>
        ::-webkit-scrollbar { width: 0px; background: transparent; }
        body { -ms-overflow-style: none; scrollbar-width: none; }
        .glow-text { text-shadow: 0 0 10px rgba(52, 211, 153, 0.8), 0 0 20px rgba(52, 211, 153, 0.5); }
    </style>
</head>
<body class="bg-gray-950 text-white h-screen flex flex-col font-sans overflow-hidden">
    <header class="bg-gray-900/70 backdrop-blur-md border-b border-gray-700/50 p-3 sm:p-5 flex justify-between items-center z-50 shadow-lg sticky top-0">
        <div class="flex flex-col justify-center">
            <h1 class="text-lg sm:text-2xl font-black bg-clip-text text-transparent bg-gradient-to-r from-blue-400 via-purple-400 to-pink-500 tracking-tight leading-none mb-1">
                SOMIC 2026
            </h1>
            <p class="text-[10px] sm:text-sm text-cyan-400 font-semibold tracking-[0.2em] uppercase">
                Family Gathering
            </p>
        </div>
        
        <div class="bg-gray-950/80 border border-gray-700/60 px-3 py-1.5 sm:px-4 sm:py-2 rounded-xl shadow-inner">
            <div id="digital-clock" class="text-xl sm:text-4xl font-mono font-bold text-emerald-400 tracking-widest glow-text leading-none">
                00:00:00
            </div>
        </div>
    </header>

    <main class="flex-1 overflow-y-auto relative p-6 md:p-12 pb-40" id="scroll-area">
        <div id="script-container" class="max-w-4xl mx-auto space-y-12">
        </div>
    </main>

    
    <div class="fixed bottom-0 left-0 w-full bg-gradient-to-t from-gray-950 via-gray-900 to-transparent p-6 z-50 pointer-events-none">
        <div class="max-w-4xl mx-auto flex gap-4 pointer-events-auto">
            <button onclick="prevLine()" class="flex-1 bg-gray-800 hover:bg-gray-700 text-white font-bold py-4 rounded-xl border border-gray-600 transition-all active:scale-95 text-lg shadow-lg">
                &#8592; Mundur
            </button>
            <button onclick="nextLine()" class="flex-[2] bg-gradient-to-r from-blue-600 to-purple-600 hover:from-blue-500 hover:to-purple-500 text-white font-bold py-4 rounded-xl shadow-lg transition-all active:scale-95 text-xl">
                Lanjut &#8594;
            </button>
        </div>
    </div>

    <!-- Pemutar Audio MP3 Lokal -->
    <audio id="lagu-ramdan" src="ramdan.mp3" preload="auto"></audio>
    <audio id="lagu-agus" src="agus.mp3" preload="auto"></audio>
    <audio id="lagu-romantis" src="romantis.mp3" preload="auto" loop></audio>
    <audio id="lagu-ultah" src="ultah.mp3" preload="auto" loop></audio>

    <script>
        // 1. FUNGSI AUDIO (Harus diluar fungsi lain agar bisa dibaca tombol)
        function toggleAudio(id) {
            const audio = document.getElementById(id);
            if (!audio) {
                alert("Elemen audio tidak ditemukan!");
                return;
            }
            if (audio.paused) {
                audio.play().catch(e => alert("Browser memblokir autoplay. coba klik lagi"));
            } else {
                audio.pause();
                audio.currentTime = 0; 
            }
        }

        // 2. KONFIGURASI FIREBASE (Ganti jika ingin sinkronisasi 2 HP, biarkan saja jika main lokal dulu)
        const firebaseConfig = {
            apiKey: "AIzaSyC5CxU9DSHLPZhnW0ryYV3Ow61KGu-GmBU",
            authDomain: "somic2026-c1a36.firebaseapp.com",
            databaseURL: "https://somic2026-c1a36-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "somic2026-c1a36",
            storageBucket: "somic2026-c1a36.firebasestorage.app",
            messagingSenderId: "952063373381",
            appId: "1:952063373381:web:d1ecf626481ba64ab3732c"
        };
        
        // Inisialisasi Firebase (Hanya berjalan jika config diisi)
        let db = null;
        try {
            if (firebaseConfig.apiKey !== "") {
                firebase.initializeApp(firebaseConfig);
                db = firebase.database();
            }
        } catch(e) { console.log("Firebase tidak aktif, menggunakan mode lokal."); }

        // 1. Siapkan tempat kosong untuk naskah
            let naskah = [];
            
            // 2. PASTE LINK CSV DARI GOOGLE SHEETS DI SINI:
            const linkGoogleSheets = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQXmNf9xTDm19Mi9sSYSmV8kMsVypzy0-qKI4i45PIoHJ0KO_5qjiLdEfBSPhONhpaYDtRhPhPYVagQ/pub?output=csv";

            // 3. Fungsi untuk mengambil dan membaca naskah otomatis
            function muatNaskahDariSheets() {
                Papa.parse(linkGoogleSheets, {
                    download: true,
                    header: true,
                    complete: function(results) {
                        // Memasukkan data dari Excel ke sistem teleprompter
                        naskah = results.data
                            .filter(baris => baris.NAMA && baris.TEKS) // Buang baris yang kosong
                            .map(baris => ({
                                nama: baris.NAMA.trim(),
                                teks: baris.TEKS.trim()
                            }));
                        
                        // Menampilkan baris pertama setelah berhasil dimuat
                        // Pastikan nama fungsinya sesuai dengan yang ada di kode Abang
                        // (Misalnya renderNaskah(), tampilkanTeks(), atau updateTampilan())
                        renderNaskah(); 
                    },
                    error: function(err) {
                        console.error("Gagal memuat naskah dari Google Sheets:", err);
                        alert("Gagal memuat naskah. Pastikan link Google Sheets sudah benar.");
                    }
                });
            }

            // 4. Panggil fungsi muatNaskah saat web pertama kali dibuka
            muatNaskahDariSheets();

        let currentIndex = 0;
        const container = document.getElementById('script-container');

        // Jam Digital
        setInterval(() => {
            document.getElementById('digital-clock').innerText = new Date().toLocaleTimeString('id-ID', { hour12: false });
        }, 1000);

        // Render Naskah
        function renderNaskah() {
            container.innerHTML = naskah.map((baris, index) => {
                let colorClass = baris.nama === "BIANCA" ? 'text-pink-400 border-pink-500' : 
                                 baris.nama === "HERU" ? 'text-cyan-400 border-cyan-500' : 
                                 'text-purple-400 border-purple-500 animate-pulse';

                const isActive = index === currentIndex;
                const activeStyle = isActive 
                    ? `opacity-100 scale-100 border-l-8 pl-6 py-4 bg-gray-800/50 rounded-r-2xl ${colorClass}` 
                    : `opacity-25 scale-95 border-l-4 pl-4 border-transparent text-gray-500`;

                return `
                    <div id="line-${index}" class="transition-all duration-500 ease-in-out transform origin-left ${activeStyle}">
                        <div class="text-sm md:text-lg font-bold tracking-widest mb-2 uppercase opacity-80">${baris.nama}</div>
                        <div class="text-3xl md:text-5xl font-semibold leading-snug">${baris.teks}</div>
                    </div>
                `;
            }).join('');

            const activeElement = document.getElementById(`line-${currentIndex}`);
            if (activeElement) activeElement.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }

        // Logic Navigasi & Firebase Sync
        if (db) {
            db.ref('mc_somic_2026/currentIndex').on('value', (snapshot) => {
                const val = snapshot.val();
                if (val !== null) {
                    currentIndex = val;
                    renderNaskah();
                } else {
                    db.ref('mc_somic_2026/currentIndex').set(0);
                }
            });
        } else {
            renderNaskah(); // Render lokal jika firebase belum diisi
        }

        function nextLine() {
            if (currentIndex < naskah.length - 1) {
                if (db) db.ref('mc_somic_2026/currentIndex').set(currentIndex + 1);
                else { currentIndex++; renderNaskah(); }
            }
        }

        function prevLine() {
            if (currentIndex > 0) {
                if (db) db.ref('mc_somic_2026/currentIndex').set(currentIndex - 1);
                else { currentIndex--; renderNaskah(); }
            }
        }

        // Keyboard Shortcut
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space' || e.code === 'ArrowRight') {
                e.preventDefault();
                nextLine();
            } else if (e.code === 'ArrowLeft') {
                prevLine();
            }
        });
    </script>
</body>
</html>
